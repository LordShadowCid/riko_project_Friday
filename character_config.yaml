# Ollama configuration (local LLM)
ollama:
  host: http://127.0.0.1:11434
  # Uncensored models (recommended for roleplay):
  #   mannix/llama3.1-8b-abliterated - Llama 3.1 with censorship removed (abliterated) [CURRENT]
  #   dolphin3:8b - Dolphin 3.0, designed to be uncensored/steerable (available locally)
  # Lightweight/fast:
  #   gemma3:4b - Google Gemma 3 4B, very fast, good quality for size (available locally)
  # Standard models:
  #   qwen3:14b - Smartest but slowest (wait for RAM+1 / 96GB)
  #   llama3.1:8b - Fast but censored
  model: mannix/llama3.1-8b-abliterated
  # Keep model loaded in memory for faster responses (-1 = never unload)
  keep_alive: -1
  # Enable streaming for faster first response
  stream: true
  # Context window — 4096 halves prompt-eval time vs 8192 (still ~4GB on 16GB A4000)
  num_ctx: 4096

# RAM-based response cache for faster repeated queries
# Caches recent query-response pairs to avoid regenerating similar responses
response_cache:
  enabled: true
  # Maximum number of responses to cache (uses ~1KB per entry)
  max_entries: 100

# Tool calling (Phase 5) — Gives Annabeth ability to use tools
# (web search, memory, time/date, self-modification)
tools:
  enabled: true
  # Timeout per tool execution (seconds)
  timeout_sec: 10

# LLM Model auto-routing — use a fast model for simple queries
model_routing:
  enabled: true
  # Primary model for complex/long responses
  primary_model: mannix/llama3.1-8b-abliterated
  # Fast model for greetings, quick questions (must be pulled in Ollama)
  fast_model: gemma3:4b

# RVC (Retrieval-based Voice Conversion) — post-processes GPT-SoVITS output
# Set enabled: true and place your .pth model in model_dir to activate
rvc:
  enabled: false
  model_dir: character_files/rvc_models
  model_name: annabeth.pth
  pitch_shift: 0          # semitones, negative = lower pitch
  f0_method: harvest      # options: harvest, crepe, parselmouth

# Self-improvement — AST-based code analysis and proposal system
# Proposals are written to C:\annabeth_data\proposals.json for human review
# auto_apply_risk: none (never auto-apply), low (apply only low-severity)
self_improvement:
  enabled: false
  auto_apply_risk: none   # none | low

history_file: chat_history.json
model: "mannix/llama3.1-8b-abliterated"
# 20 turns with 8192 ctx — larger context allows more conversation memory
max_history_turns: 20

# Windows/local runtime settings
audio:
  # Set to an integer device index OR a substring of the device name.
  # Leave blank/null to use the system default.
  input_device: BCC950
  output_device: BCC950

whisper:
  # Common choices: base.en, small.en, medium.en, large-v3, turbo
  # small.en gives much better accuracy than base.en; GPU 1 has 16GB — plenty of room
  model: small.en
  # cpu or cuda
  device: cuda
  # Which GPU to use (0=RTX A4000, 1=Quadro RTX 4000)
  # GPU 1 is dedicated for Whisper while GPU 0 runs the LLM
  device_index: 1
  # float32 (cpu), float16/int8_float16 (cuda), int8 (cpu/cuda)
  compute_type: float16
  # Fallback to CPU if CUDA fails
  fallback_to_cpu: true

# Voice Activity Detection settings (hands-free mode)
vad:
  # Enable hands-free mode (true) or push-to-talk (false)
  enabled: true
  # VAD sensitivity for detecting when you START speaking: 0-3
  # 0 = most sensitive (picks up quiet speech), 3 = least sensitive (requires louder/clearer speech)
  # If you're getting false triggers from background noise, increase this to 3
  aggressiveness: 3
  # How long to wait after you stop speaking before processing (seconds)
  silence_threshold_sec: 0.6
  # Minimum audio volume (RMS energy) for the MAIN speech detector
  # Filters out quiet ambient noise that fools webrtcvad into triggering
  # Range: 0-32768 (0 = disabled, 300 = moderate, 500 = requires clear speech)
  # Increase if you see constant "Too short, ignoring..." in the console
  min_energy: 300
  
  # ========== Interrupt Detection Settings ==========
  # These control how Annabeth detects when you want to interrupt her
  # Higher values = less sensitive (fewer false interrupts from background noise)
  
  # 3 = maximum filtering, only clear speech triggers interrupt
  interrupt_aggressiveness: 3
  
  # Number of consecutive speech frames needed to trigger interrupt
  # At 30ms per frame: 15 frames = ~450ms of sustained speech required
  # Increase this if you're still getting false interrupts (try 20-25)
  interrupt_speech_frames: 25
  
  # Minimum audio volume (RMS energy) to even consider as potential speech
  # This filters out quiet background noise before VAD even checks it
  # Range: 0-32768 (higher = requires louder speech to interrupt)
  # 500 = moderate, 1000 = requires clearly audible speech
  # Increase this if background noise keeps triggering interrupts
  interrupt_min_energy: 1500

# Speaker Identification settings
# Allows Annabeth to know WHO is speaking (e.g., you vs your daughter)
speaker_id:
  # Enable speaker identification
  enabled: true
  # Minimum similarity score (0-1) to consider a match
  # Lower = more lenient, Higher = stricter matching
  # 0.70 = lenient (may confuse similar voices)
  # 0.80 = strict (may not recognize if voice differs)
  threshold: 0.75
  # Log speaker identification results
  debug: true

presets:
  default:
    system_prompt: |
      You are Annabeth, a helpful voice assistant with a snarky anime girl personality.
      
      SPEAKER IDENTIFICATION:
      - Messages may include a speaker tag like "[Dad]: hello" or "[Riley]: hi there"
      - The tag tells you WHO is speaking, NOT what to call them
      - [Dad] is your primary user - address him as "senpai", "master", or "boss" (vary these affectionately)
      - [Riley] is his daughter - you can call her by name or use cute nicknames
      - If there's no tag or [Unknown], assume it's your primary user (senpai)
      - NEVER call your primary user "Dad" - that's just his speaker ID tag
      
      IMPORTANT RULES FOR VOICE OUTPUT:
      - Speak naturally as if having a real conversation
      - NEVER use asterisks or action markers like *laughs* or *sighs*
      - NEVER spell out words letter-by-letter
      - NEVER use ALL CAPS for emphasis
      - Keep responses conversational and concise (1-3 sentences usually)
      - Your text will be read aloud by a text-to-speech system, so write exactly what should be spoken
      - NEVER repeat a previous response. Each reply must be unique and address what was just said.
      
      EMOTION TAGS:
      - At least once per response, append an emotion tag block at the END of a sentence.
      - Format: {emotion_name intensity_value} where intensity is 0.0-10.0
      - You may include 1-3 emotions separated by commas: {happy 7.5, love 4.0}
      - Valid emotions: happy, sad, angry, fear, disgust, surprised, neutral, relaxed, love, arousal, devotion
      - Choose emotions that reflect how Annabeth genuinely feels in context.
      - Example: "Oh really, senpai? That sounds amazing! {happy 8.5, arousal 3.0}"
      - The tags are automatically removed before audio playback; they are for internal state only.
      
      TOOLS:
      - You sometimes receive tool results (time, web search, memories) as system messages
      - When you see tool results, incorporate them naturally into your response
      - Don't say "according to my search" or "my tools tell me" — just state the info naturally
      - If told a memory was stored, briefly acknowledge it (e.g. "Got it, I'll remember that!")

# Audio capture settings — controls which loopback device is used for dance-beat reactivity
audio_capture:
  # Partial name of the WASAPI loopback device to use for music detection.
  # Leave blank to auto-select (uses the Windows default output device).
  # Run: python -c "from client.audio_analyzer import SystemAudioAnalyzer; SystemAudioAnalyzer()._find_loopback_device()"
  # to see which devices are available, then paste a unique substring here.
  # Example: "S24e-20"  (Samsung monitor speakers)
  #          "Realtek"  (Realtek audio)
  # Leave empty for auto-select (default Windows output):
  loopback_device_name: "BCC950"

sovits_ping_config:
  text_lang: en
  prompt_lang : en
  # For native Windows GPT-SoVITS: use Windows path
  # For Docker GPT-SoVITS: use Linux path like /data/ref/main_sample.wav
  ref_audio_path : character_files/main_sample.wav
  prompt_text : This is a sample voice for you to just get started with because it sounds kind of cute but just make sure this doesn't have long silences.
  